name = "deye-monitor"
main = "src/index.ts"
compatibility_date = "2026-11-06"
keep_vars = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "GRID_DB"
database_name = "deye-monitor"
database_id = "bd05012f-40bf-4c40-8420-726ceb37530c"
